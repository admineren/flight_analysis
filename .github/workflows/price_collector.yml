name: Price Collector

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and Send
        env:
          TINYBIRD_HOST: ${{ secrets.TINYBIRD_HOST }}
          TB_INGEST_TOKEN: ${{ secrets.TB_INGEST_TOKEN }}
          PYTHONUNBUFFERED: 1
        run: python -u price_collector.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f price_collector_state.json ]; then
            git add price_collector_state.json
            git commit -m "update price collector state [skip ci]" || echo "no changes"
            git pull --rebase origin main || true
            git push
          fi
