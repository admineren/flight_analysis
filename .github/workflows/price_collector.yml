name: Price Collector

on:
  schedule:
    - cron: "0 */4 * * *"        # 6 → 4 saat (günde 6 deneme)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and Send
        env:
          TINYBIRD_HOST: ${{ secrets.TINYBIRD_HOST }}
          TB_INGEST_TOKEN: ${{ secrets.TB_INGEST_TOKEN }}
          PYTHONUNBUFFERED: 1
        run: python -u price_collector.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/price_collector_state.json ]; then
            git add data/price_collector_state.json
            if git diff --cached --quiet; then
              echo "Değişiklik yok"
            else
              git commit -m "update price collector state [skip ci]"
              git pull --rebase origin ${{ github.ref_name }} || true
              git push
            fi
          fi
