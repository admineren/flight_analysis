name: Price Collector

on:
  schedule:
    - cron: "0 */12 * * *"  # Günde 2 kez (09:00 ve 21:00 TSİ)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install viajante requests
      - name: Collect and Send
        env:
          TINYBIRD_HOST: ${{ secrets.TINYBIRD_HOST }}
          TB_INGEST_TOKEN: ${{ secrets.TB_INGEST_TOKEN }}
        run: python price_collector.py
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_collector_state.json
          git commit -m "update price collector state [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push
