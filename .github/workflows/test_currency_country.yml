name: Currency Country TEST

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install swoop-flights airportsdata requests
      - name: Run currency country test
        run: python test_currency_country.py
