name: Swoop Monitor

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: swoop-monitor
  cancel-in-progress: false    # state yarım kalmasın

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install swoop-flights airportsdata requests

      - name: data/ hazırla
        run: mkdir -p data

      - name: Run swoop monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swoop_monitor.py

      - name: Persist state
        if: always()    # monitor fail etse bile state kaydedilsin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swoop_search_state.json data/swoop_deals_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "update swoop state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
