name: Ucuza Uc Check

on:
  schedule:
    - cron: "0 */2 * * *"        # 30dk → 2 saat
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-watcher
  cancel-in-progress: false       # state yarım kalmasın

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: data/ hazırla
        run: mkdir -p data

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Persist seen state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ucuzauc_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "update ucuzauc state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
