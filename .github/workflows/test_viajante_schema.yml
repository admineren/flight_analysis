name: Viajante Gelişmiş Test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install viajante
      - name: Run advanced tests
        env:
          VIAJANTE_PRICE_HISTORY: "1"   # Fiyat geçmişini etkinleştir
        run: python test_viajante_gelismis.py
