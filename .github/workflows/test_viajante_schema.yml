name: Viajante Schema

on:
  workflow_dispatch: {}

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install viajante
      - name: Run schema dump
        run: python test_viajante_schema.py
