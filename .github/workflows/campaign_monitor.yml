name: Kampanya Sayfası İzleyici

on:
  schedule:
    - cron: "0 */4 * * *"   # Her 4 saatte bir (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: campaign-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests curl_cffi beautifulsoup4
      - name: Run campaign monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python campaign_monitor.py
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add campaign_state.json
          git commit -m "update campaign state [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push
