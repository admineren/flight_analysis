name: Deploy Tinybird Project

on:
  push:
    branches: [main]
    paths:
      - 'tinybird/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TINYBIRD_HOST: ${{ secrets.TINYBIRD_HOST }}   # Örn: https://api.tinybird.co
      TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }} # Workspace Admin Token
    steps:
      - uses: actions/checkout@v4

      - name: Install Tinybird CLI
        run: curl https://tinybird.co | sh

      - name: Deploy to Tinybird Cloud
        run: tb --cloud --host ${{ env.TINYBIRD_HOST }} --token ${{ env.TINYBIRD_TOKEN }} deploy
        working-directory: tinybird
