name: Swoop Deals TEST

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install swoop-flights
      - name: Run swoop deals test
        run: python test_swoop_deals.py
