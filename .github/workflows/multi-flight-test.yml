name: Multi Flight Scraper Test

on:
  workflow_dispatch: {}  # Sadece manuel tetikleme (test için)

jobs:
  test-scrapers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Biri hata verse bile diğerleri devam etsin
      matrix:
        include:
          - name: "fast-flights"
            package: "fast-flights"
            script: |
              from fast_flights import FlightQuery, Passengers, create_query, get_flights
              query = create_query(
                  flights=[FlightQuery(date="2027-01-15", from_airport="IST", to_airport="BCN")],
                  trip="one-way", seat="economy", passengers=Passengers(adults=1)
              )
              results = get_flights(query)
              print(f"fast-flights: {len(results)} sonuç bulundu.")
              if results: print(f"En ucuz: {results[0]}")

          - name: "swoop-flights"
            package: "swoop-flights"
            script: |
              from swoop import search
              result = search("IST", "BCN", "2027-01-15")
              print(f"swoop-flights: {len(result.results)} sonuç bulundu.")
              if result.results: print(f"En ucuz: {result.results[0].price}")

          - name: "viajante"
            package: "viajante"
            script: |
              from viajante import search_flights
              results = search_flights("IST", "BCN", "2027-01-15")
              print(f"viajante: {len(results)} sonuç bulundu.")
              if results: print(f"En ucuz: {results[0]}")

          - name: "LetsFG"
            package: "letsfg"
            script: |
              import asyncio
              from letsfg.local import search_local
              async def run():
                  result = await search_local("IST", "BCN", "2027-01-15")
                  print(f"LetsFG: {len(result.offers)} sonuç bulundu.")
                  if result.offers: print(f"En ucuz: {result.offers[0].price}")
              asyncio.run(run())

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ${{ matrix.package }}

      - name: Run test
        run: python -c "${{ matrix.script }}"
