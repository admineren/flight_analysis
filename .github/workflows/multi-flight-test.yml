name: Multi Flight Scraper Test

on:
  workflow_dispatch: {}

jobs:
  test-scrapers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "fast-flights"
            package: "fast-flights typing_extensions"
            file: "test_fast_flights.py"
          - name: "swoop-flights"
            package: "swoop-flights"
            file: "test_swoop.py"
          - name: "viajante"
            package: "viajante"
            file: "test_viajante.py"
          - name: "LetsFG"
            package: "letsfg"
            file: "test_letsfg.py"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ${{ matrix.package }}
      - name: Run test
        run: python ${{ matrix.file }}
