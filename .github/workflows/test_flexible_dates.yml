name: Flexible Dates TEST

on:
  workflow_dispatch: {}   # Sadece manuel çalışır, cron YOK

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install swoop-flights
      - name: Run flexible dates test
        run: python test_flexible_dates.py
